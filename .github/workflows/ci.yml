name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: pip install numpy pandas matplotlib scipy streamlit
      - name: Syntax-check the dashboard
        run: python -c "import ast; ast.parse(open('app.py').read()); print('app.py syntax OK')"
      - name: Framework smoke test (synthetic data, end-to-end)
        run: python tests/test_smoke.py
