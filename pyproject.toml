[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "p3evhm"
version = "1.0.0"
description = "Parallel Physics-Informed Prognostics for EV Battery Health Management: physics-informed LSTM + particle-filter RUL with a 6-baseline benchmark harness and GPU acceleration."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "pandas>=2.0", "matplotlib>=3.7", "scipy>=1.10", "torch>=2.0"]

[tool.setuptools]
packages = ["p3evhm"]
